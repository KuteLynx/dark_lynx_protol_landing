name: Deploy to GitHub Pages

on:
  push:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack & install pnpm
        run: corepack enable && pnpm --version

      - run: pnpm install --frozen-lockfile

      - name: Validate Vite public env
        run: |
          test -n "$VITE_TURNSTILE_SITE_KEY" || { echo "Missing GitHub Actions variable: VITE_TURNSTILE_SITE_KEY"; exit 1; }
          test -n "$VITE_CONTACT_API_URL" || { echo "Missing GitHub Actions variable: VITE_CONTACT_API_URL"; exit 1; }
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_CONTACT_API_URL: ${{ vars.VITE_CONTACT_API_URL }}

      - run: pnpm build
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_CONTACT_API_URL: ${{ vars.VITE_CONTACT_API_URL }}
          VITE_JOURNAL_API_URL: ${{ vars.VITE_JOURNAL_API_URL || 'https://dark-lynx-protol-landing.onrender.com/api/journal' }}

      - name: Add .nojekyll
        run: touch build/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
